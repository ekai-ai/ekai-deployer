services:
  # ─── Platform ────────────────────────────────────────────────────────────────

  ekai-postgres:
    image: postgres:16-alpine
    container_name: ekai-postgres
    environment:
      POSTGRES_USER: ekai
      POSTGRES_PASSWORD: ekai321backend
      POSTGRES_DB: ekaibackend
    ports:
      - "5432:5432"
    volumes:
      - ekai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekai -d ekaibackend"]
      interval: 10s
      timeout: 5s
      retries: 5

  ekai-backend:
    image: public.ecr.aws/s7m9t1b0/ekai/ekai-backend:dev
    container_name: ekai-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      ekai-postgres:
        condition: service_healthy

  ekai-frontend:
    image: public.ecr.aws/s7m9t1b0/ekai/ekai-frontend:dev
    container_name: ekai-frontend
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      - ekai-backend

  # ─── AI-Core deps ────────────────────────────────────────────────────────────

  erd-redis-stack:
    image: redis/redis-stack:latest
    container_name: erd-redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - CONFIG_ROOT=/app/config
    volumes:
      - ./services/ai-core/config:/app/config
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  erd-neo4j:
    image: neo4j:latest
    container_name: erd-neo4j
    volumes:
      - neo4j-logs:/logs
      - neo4j-config:/config
      - neo4j-data:/data
      - neo4j-plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/ekai_dev_@
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always

  langfuse-minio:
    image: minio/minio:latest
    container_name: langfuse-minio
    ports:
      - "9090:9000"
      - "9091:9001"
    environment:
      - MINIO_ROOT_USER=langfuse
      - MINIO_ROOT_PASSWORD=langfuse123
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      langfuse-minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=langfuse
      - MINIO_ROOT_PASSWORD=langfuse123
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://langfuse-minio:9000 langfuse langfuse123;
      mc mb myminio/ekai-files --ignore-existing;
      mc mb myminio/langfuse-events --ignore-existing;
      exit 0;
      "

  # ─── AI-Core app ─────────────────────────────────────────────────────────────

  ekai-erd:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: public.ecr.aws/s7m9t1b0/ekai/ekai-erd:dev
    container_name: ekai-erd
    ports:
      - "9002:9002"
    volumes:
      - ai-core-workspaces:/app/workspaces
    env_file:
      - .env
    environment:
      - REDIS_HOST=erd-redis-stack
      - REDIS_PORT=6379
      - AI_CORE__REDIS_DB=0
      - SKIP_CLOUDWATCH=true
      - SANDBOX_REQUIRED=${SANDBOX_REQUIRED:-true}
    depends_on:
      - erd-redis-stack
    restart: unless-stopped

  ekai-ai-core-worker:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: public.ecr.aws/s7m9t1b0/ekai/ekai-erd:dev
    container_name: ekai-ai-core-worker
    entrypoint:
      [
        "wda",
        "/usr/local/bin/wdl",
        "/usr/local/bin/wdb",
        "W",
        "--",
        "arq",
        "api.services.workers.agent_workers.WorkerSettings",
      ]
    env_file:
      - .env
    environment:
      - REDIS_HOST=erd-redis-stack
      - REDIS_PORT=6379
      - AI_CORE__REDIS_DB=0
      - SKIP_CLOUDWATCH=true
      - EKAI_DEPLOY_TOKEN=
      - EKAI_LICENSING_PORTAL_URL=
    volumes:
      - ai-core-workspaces:/app/workspaces
    depends_on:
      erd-redis-stack:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  ekai-document-worker:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: public.ecr.aws/s7m9t1b0/ekai/ekai-document-worker:dev
    container_name: ekai-document-worker
    env_file:
      - .env
    environment:
      - REDIS_HOST=erd-redis-stack
      - REDIS_PORT=6379
      - AI_CORE__REDIS_DB=0
      - SKIP_CLOUDWATCH=true
    volumes:
      - ai-core-workspaces:/app/workspaces
    depends_on:
      erd-redis-stack:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped

  ekai-profile-worker:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: public.ecr.aws/s7m9t1b0/ekai/ekai-profile-worker:dev
    env_file:
      - .env
    environment:
      - REDIS_HOST=erd-redis-stack
      - REDIS_PORT=6379
      - AI_CORE__REDIS_DB=0
      - SKIP_CLOUDWATCH=true
    volumes:
      - ai-core-workspaces:/app/workspaces
    depends_on:
      erd-redis-stack:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped

volumes:
  ekai_postgres_data:
  redis-data:
  minio-data:
  neo4j-logs:
  neo4j-data:
  neo4j-config:
  neo4j-plugins:
  ai-core-workspaces:
